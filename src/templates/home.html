{{#if wyrozniony}}
<div class="featured-band">
  <div class="container container--press">
    <article class="press-item press-item--featured">
      <a class="press-item__link" href="{{ wyrozniony.url }}">
        <div class="press-item__body">
          <p class="press-item__meta">
            <span class="press-item__badge">Najnowsze</span>
            <span class="press-item__kategoria">{{ wyrozniony.kategoriaNazwa }}</span>
            <time datetime="{{ wyrozniony.data }}">{{ wyrozniony.dataPl }}</time>
          </p>
          <h1 class="press-item__title">{{ wyrozniony.tytul }}</h1>
          <p class="press-item__lead">{{ wyrozniony.lead }}</p>
          <span class="press-item__more" aria-hidden="true">Czytaj więcej →</span>
        </div>
        <div class="press-item__media">
          <img src="{{ wyrozniony.grafikaUrl }}" srcset="{{ wyrozniony.grafikaSrcset }}"
               sizes="(max-width: 768px) 100vw, 460px"
               alt="" loading="eager" fetchpriority="high" class="press-item__img{{ wyrozniony.kadrKlasa }}">
        </div>
      </a>
    </article>
  </div>
</div>
{{/if}}

<section class="section section--hp-lista" aria-labelledby="wczesniejsze">
  <div class="container container--press">
    <!-- Etykieta, nie naglowek ekspozycyjny: sekcja tylko oddziela liste od
         wyroznionego newsa. Link "Wszystkie aktualnosci" usuniety — dublowal
         pozycje z menu glownego dwa rzedy wyzej. -->
    <h2 id="wczesniejsze" class="section-eyebrow lista-etykieta">Wcześniejsze publikacje</h2>
    {{#each pozostale}}{{> press-item }}{{/each}}

    <!-- Na koncu listy, nie przy naglowku: tam link dublowal menu i rozpychal
         sekcje, tu jest naturalnym nastepnym krokiem po doczytaniu do konca. -->
    <p class="lista-wiecej">
      <a class="btn btn--secondary btn--medium lista-wiecej__cta" href="/aktualnosci/">Więcej aktualności</a>
    </p>
  </div>
</section>
